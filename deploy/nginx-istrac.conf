# ==============================================================================
# ISTRAC-FMS NGINX Reverse Proxy Configuration (RHEL / CentOS)
# Location: /etc/nginx/conf.d/istrac.conf
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Maximum file upload size for mission telemetry & datasets
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Frontend Static Assets (Vite React SPA)
    location / {
        root /opt/istrac-fms/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static chunks
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. Backend REST API Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large dataset downloads / streams
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 3. Direct File Streaming / Download Endpoint
    location /files/ {
        proxy_pass http://127.0.0.1:5000/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # 4. WebSocket Real-time Feeds (MOX Telemetry & Notifications)
    location /ws {
        proxy_pass http://127.0.0.1:5000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
