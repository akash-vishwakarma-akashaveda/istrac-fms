# ==============================================================================
# 🛰️ ISTRAC-SIMS Apache HTTP Server (httpd) Production VirtualHost Configuration
# Target OS: Red Hat Enterprise Linux 8 / 9 (RHEL)
# Location on RHEL: /etc/httpd/conf.d/istrac-sims.conf
#
# Prerequisite Apache Modules (enabled by default in RHEL httpd):
#   mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite, mod_headers, mod_deflate
#
# Prerequisite SELinux Boolean:
#   setsebool -P httpd_can_network_connect 1
#   semanage fcontext -a -t httpd_sys_content_t "/opt/istrac-fms/frontend/dist(/.*)?"
#   restorecon -Rv /opt/istrac-fms/frontend/dist
# ==============================================================================

<VirtualHost *:80>
    ServerName _
    ServerAdmin admin@istrac.local

    # Frontend Single Page Application (Vite Build)
    DocumentRoot "/opt/istrac-fms/frontend/dist"

    # Max body upload size for telemetry / file uploads (100 MB = 104857600 bytes)
    LimitRequestBody 104857600

    # --------------------------------------------------------------------------
    # 1. Security Headers & MIME Hardening
    # --------------------------------------------------------------------------
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --------------------------------------------------------------------------
    # 2. Gzip / Deflate Compression
    # --------------------------------------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css
        AddOutputFilterByType DEFLATE application/xml application/xhtml+xml application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript application/x-javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # --------------------------------------------------------------------------
    # 3. Static Assets Caching
    # --------------------------------------------------------------------------
    <Directory "/opt/istrac-fms/frontend/dist/assets">
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
        </IfModule>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # --------------------------------------------------------------------------
    # 4. Reverse Proxy Settings (Backend API & WebSockets)
    # --------------------------------------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120

    # Ensure required proxy headers reach Express
    RequestHeader set X-Forwarded-Proto "http"

    # 4a. WebSocket Telemetry Feed (/ws) -> Backend ws://127.0.0.1:3000/ws
    # (Matches port 3000 default; change to 5000 if backend is configured on 5000)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws/(.*)           ws://127.0.0.1:3000/ws/$1 [P,L]
    RewriteRule ^/ws/?$             ws://127.0.0.1:3000/ws [P,L]

    # 4b. REST API Proxy (/api/*) -> Backend http://127.0.0.1:3000/api/*
    ProxyPass        /api http://127.0.0.1:3000/api retry=0 timeout=120
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # 4c. CMS Uploaded Media (/media/*) -> Backend http://127.0.0.1:3000/media/*
    ProxyPass        /media http://127.0.0.1:3000/media retry=0 timeout=60
    ProxyPassReverse /media http://127.0.0.1:3000/media

    # --------------------------------------------------------------------------
    # 5. SPA Client-Side Routing Fallback (HTML5 PushState)
    # --------------------------------------------------------------------------
    <Directory "/opt/istrac-fms/frontend/dist">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # --------------------------------------------------------------------------
    # 6. Logging
    # --------------------------------------------------------------------------
    ErrorLog /var/log/httpd/istrac-sims-error.log
    CustomLog /var/log/httpd/istrac-sims-access.log combined
</VirtualHost>
