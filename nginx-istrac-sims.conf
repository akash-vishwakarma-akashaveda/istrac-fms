# ==============================================================================
# ISTRAC-SIMS Nginx Production Reverse Proxy Configuration for Red Hat Enterprise Linux
# Save to: /etc/nginx/conf.d/istrac-sims.conf
# ==============================================================================

# Upstream Backend API Server
upstream istrac_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _; # Catch all or specify domain: istrac-portal.isro.local

    # Max upload body size for chunked & telemetry ingestion
    client_max_body_size 100M;

    # Root directory for compiled React 19 / Vite SPA
    root /opt/istrac-fms/frontend/dist;
    index index.html;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Frontend Static Assets with Aggressive Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. REST API Reverse Proxy to Node.js Backend
    location /api/ {
        # Strip /api prefix before forwarding to Express
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://istrac_backend;
        proxy_http_version 1.1;
        
        # Preserve client headers & real IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer and timeout settings for large file transfers
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 3. Real-Time WebSocket Proxy Gateway (/ws)
    location /ws {
        proxy_pass http://istrac_backend/ws;
        proxy_http_version 1.1;
        
        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Extended timeout for long-lived telemetry connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Single Page Application (SPA) Fallback Route
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
