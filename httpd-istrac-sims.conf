# ==============================================================================
# ISTRAC-SIMS Apache HTTP Server (httpd) Production Configuration (RHEL / CentOS)
# Save to: /etc/httpd/conf.d/istrac-sims.conf
# ==============================================================================

# Ensure required modules are loaded (standard on RHEL 8 / 9 httpd):
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
# LoadModule rewrite_module modules/mod_rewrite.so
# LoadModule headers_module modules/mod_headers.so
# LoadModule deflate_module modules/mod_deflate.so
# LoadModule expires_module modules/mod_expires.so

<VirtualHost *:80>
    ServerName istrac-portal.isro.local
    ServerAlias *

    # Document root pointing to compiled React 19 / Vite SPA
    DocumentRoot /opt/istrac-fms/frontend/dist

    # Upload limit: 500MB (524288000 bytes) for telemetry & mission file ingestion
    LimitRequestBody 524288000

    # Logging
    ErrorLog /var/log/httpd/istrac-error.log
    CustomLog /var/log/httpd/istrac-access.log combined

    # Security Headers (Enforced across all responses)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Compression (Gzip / Deflate)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css application/xml application/xhtml+xml application/rss+xml application/javascript application/x-javascript application/json image/svg+xml
        SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|ico|zip|gz|tar|pdf)$ no-gzip dont-vary
    </IfModule>

    # Frontend Single Page Application (SPA) Directory Configuration
    <Directory "/opt/istrac-fms/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA Fallback Routing
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Allow direct access to real files and directories
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # Do not rewrite proxy endpoints
            RewriteCond %{REQUEST_URI} ^/(api|media|ws|files) [NC]
            RewriteRule ^ - [L]

            # Route all other URLs to index.html for client-side React routing
            RewriteRule ^ index.html [L]
        </IfModule>

        # Prevent browser caching of index.html so users always get active builds
        <Files "index.html">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires 0
        </Files>
    </Directory>

    # Aggressive Caching for Hashed Frontend Assets
    <Directory "/opt/istrac-fms/frontend/dist/assets">
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
        </IfModule>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Reverse Proxy Gateway Configuration
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 600

    # 1. Real-Time WebSocket Proxy Gateway (/ws)
    # mod_proxy_wstunnel must be enabled. WebSocket ProxyPass MUST precede standard HTTP proxies.
    ProxyPass /ws ws://127.0.0.1:3000/ws retry=0 timeout=86400 keepalive=On
    ProxyPassReverse /ws ws://127.0.0.1:3000/ws

    # 2. REST API Reverse Proxy to Node.js Backend
    ProxyPass /api http://127.0.0.1:3000/api retry=0 timeout=600
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # 3. Static CMS Media Assets (Banners, Wallpapers, Slide Images)
    ProxyPass /media http://127.0.0.1:3000/media retry=0 timeout=120
    ProxyPassReverse /media http://127.0.0.1:3000/media

    # 4. Direct File Streaming / Download Endpoint
    ProxyPass /files http://127.0.0.1:3000/files retry=0 timeout=600
    ProxyPassReverse /files http://127.0.0.1:3000/files
</VirtualHost>
